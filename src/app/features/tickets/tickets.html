@let ticketPhaseContainerClass = 'flex flex-col justify-center items-center gap-[2rem] md:flex-row';

<div class="flex justify-center">
  <div class="w-full max-w-[72rem]">
    <div class="flex flex-col gap-4">
      <span class="type-title" i18n>BOLETOS</span>
      <span class="type-subtitle" i18n>Fases de Venta</span>
    </div>

    <div class="mt-[2rem] flex flex-col gap-[2rem]">
      <div [class]="ticketPhaseContainerClass">
        <app-ticket-phase
          [ticketType]="tickets[0]"
          [dateRangeLabel]="tickets[0].dateRangeLabel"
          [imagePath]="tickets[0].imagePath"
          [isDateRangeValidationEnable]="isDateRangeValidationEnable"
          [showIncomingPlaceholder]="false"
          (onClick)="onTicketClick()"
        />
        <app-ticket-phase
          [ticketType]="tickets[1]"
          [dateRangeLabel]="tickets[1].dateRangeLabel"
          [imagePath]="tickets[1].imagePath"
          [isDateRangeValidationEnable]="isDateRangeValidationEnable"
          [forceDisplay]="true"
          [showIncomingPlaceholder]="false"
          (onClick)="onTicketClick()"
        />
      </div>
      <div [class]="ticketPhaseContainerClass">
        <app-ticket-phase
          [ticketType]="tickets[2]"
          [dateRangeLabel]="tickets[2].dateRangeLabel"
          [imagePath]="tickets[2].imagePath"
          [isDateRangeValidationEnable]="isDateRangeValidationEnable"
          [forceDisplay]="true"
          [showIncomingPlaceholder]="true"
          (onClick)="onTicketClick()"
        />
        <app-ticket-phase
          [ticketType]="tickets[3]"
          [dateRangeLabel]="tickets[3].dateRangeLabel"
          [imagePath]="tickets[3].imagePath"
          [isDateRangeValidationEnable]="isDateRangeValidationEnable"
          [forceDisplay]="true"
          [showIncomingPlaceholder]="true"
          (onClick)="onTicketClick()"
        />
      </div>
    </div>
  </div>
</div>
