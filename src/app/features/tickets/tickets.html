@let titleClass = 'text-3xl font-medium text-[#F9DF15] text-[2.4rem] font-brunson tracking-wide';
@let subtitleClass = 'text-lg font-medium text-white font-coolvetica';
@let ticketPhaseContainerClass = 'flex flex-col justify-center items-center gap-[2rem] md:flex-row';

<div class="flex flex-col gap-2">
  <span [class]="titleClass">BOLETOS</span>
  <span [class]="subtitleClass">Fases de Venta</span>
</div>

<div class="flex flex-col gap-[2rem]">
  <div [class]="ticketPhaseContainerClass">
    <app-ticket-phase
      [ticketType]="phase1TicketType()"
      dateRangeLabel="16 NOVIEMBRE AL 31 DICIEMBRE"
      (onClick)="onTicketClick($event)"
    />
    <app-ticket-phase
      [ticketType]="phase2TicketType()"
      dateRangeLabel="1 ENERO AL 28 FEBRERO"
      imagePath="assets/img/TJ_GHOST.png"
      [forceDisplay]="true"
      (onClick)="onTicketClick($event)"
    />
    <app-ticket-phase
      [ticketType]="phase3TicketType()"
      dateRangeLabel="1 MARZO AL 30 ABRIL"
      (onClick)="onTicketClick($event)"
    />
  </div>
  <div [class]="ticketPhaseContainerClass">
    <app-ticket-phase
      [ticketType]="phase4TicketType()"
      dateRangeLabel="1 MAYO AL 30 JUNIO"
      (onClick)="onTicketClick($event)"
    />
    <app-ticket-phase
      [ticketType]="phase5TicketType()"
      dateRangeLabel="1 AL 16 JULIO"
      (onClick)="onTicketClick($event)"
    />
  </div>
</div>
