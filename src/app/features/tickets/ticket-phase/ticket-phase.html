<div class="relative">
  <div
    class="flex h-[16rem] w-[14rem] flex-col items-center justify-center gap-4 bg-[#171616]"
    [class.cursor-pointer]="isCurrentPhase()"
    [class.hover:bg-[#FF7630]]="isCurrentPhase()"
    (click)="isCurrentPhase() && onClick.emit(ticketType())"
  >
    @if (ticketType() && (isCurrentPhase() || forceDisplay())) {
      <span class="font-coolvetica text-xl text-white">{{ name() }}</span>
      <div class="flex flex-col items-center justify-center">
        <span class="font-coolvetica text-white">{{ dateRangeLabel() }}</span>
        <span class="font-coolvetica text-white">
          GENERAL: ${{ ticketType()?.price | number: '1.0-0' }}
        </span>
      </div>
      <img src="{{ imagePath() }}" alt="Mano" class="h-[8rem]" />
    } @else {
      <span class="font-brunson text-[7rem] text-white">???</span>
    }
  </div>
  @if (ticketType() && isPastPhase()) {
    <span
      class="absolute bottom-[6rem] left-[-0.5rem] w-[15rem] bg-[#FF4400] py-[0.5rem] text-center font-brunson text-4xl tracking-wide"
      i18n
    >
      AGOTADO
    </span>
  }
</div>
