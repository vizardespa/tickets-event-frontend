<div class="relative">
  <div
    class="ticket-phase flex h-[16rem] w-[14rem] flex-col items-center justify-center gap-4 bg-[#171616]"
    [class.ticket-phase--current]="isSelectable()"
    [class.cursor-pointer]="isSelectable()"
    [class.hover:bg-[#FF7630]]="isSelectable()"
    (click)="isSelectable() && onClick.emit(ticketType())"
  >
    @if (showDetails()) {
      <span
        class="font-coolvetica text-white"
        [class.text-xl]="shouldShowDateRangeLabel()"
        [class.text-3xl]="!shouldShowDateRangeLabel()"
      >
        {{ name() }}
      </span>
      <div class="flex flex-col items-center justify-center">
        @if (shouldShowDateRangeLabel()) {
          <span class="font-coolvetica text-white">{{ dateRangeLabel() }}</span>
        }
        <span class="font-coolvetica text-white" [class.text-lg]="!shouldShowDateRangeLabel()">
          GENERAL: ${{ ticketType()?.price | number: '1.0-0' }}
        </span>
      </div>
      <img
        src="{{ imagePath() }}"
        alt="Mano"
        class="ticket-phase__image"
        [style.height.rem]="shouldShowDateRangeLabel() ? 8 : 8.5"
      />
    } @else {
      <span class="font-brunson text-[7rem] text-white">???</span>
    }
  </div>
  @if (isSoldOut()) {
    <span
      class="absolute bottom-[6rem] left-[-0.5rem] w-[15rem] bg-[#FF4400] py-[0.5rem] text-center font-brunson text-4xl tracking-wide"
      i18n
    >
      AGOTADO
    </span>
  }
</div>
