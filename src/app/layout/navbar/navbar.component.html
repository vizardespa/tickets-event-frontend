@let buttonClass =
  'bg-transparent border-0 cursor-pointer text-white hover:text-[#F8DF15] transition-colors duration-300';
@let dividerClass = 'text-white font-bold';

<div #header class="flex h-[3em] items-center justify-between bg-[#171616] px-[4rem]">
  <img src="assets/img/tj-rock-logo.svg" alt="Tijuana Rockea! logo" class="h-[2rem] w-[4rem]" />
  <div #buttonsSection class="flex gap-2">
    <button class="{{ buttonClass }}" routerLink="/dashboard" routerLinkActive="!text-[#F8DF15]">
      INICIO
    </button>
    <span class="{{ dividerClass }}">|</span>
    <button class="{{ buttonClass }}">LINE UP</button>
    <span class="{{ dividerClass }}">|</span>
    <button class="{{ buttonClass }}" routerLink="/events" routerLinkActive="!text-[#F8DF15]">
      BOLETOS
    </button>
    <span class="{{ dividerClass }}">|</span>
    <button class="{{ buttonClass }}">HISTORIA</button>
    <span class="{{ dividerClass }}">|</span>
    <button class="{{ buttonClass }}">MERCH</button>
    <span class="{{ dividerClass }}">|</span>
    <button class="{{ buttonClass }}">CONTACTO</button>
  </div>
</div>
